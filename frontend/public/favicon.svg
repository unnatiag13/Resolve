<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="resolveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#090D16" stroke="url(#resolveGrad)" stroke-width="2.5" />
  
  <!-- Antenna -->
  <circle cx="32" cy="17" r="3" fill="#A855F7" filter="url(#glow)" />
  <line x1="32" y1="20" x2="32" y2="25" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Bot Head Frame -->
  <rect x="16" y="25" width="32" height="22" rx="7" fill="#131B2E" stroke="url(#resolveGrad)" stroke-width="2" />
  
  <!-- Glowing Eyes -->
  <circle cx="25" cy="33" r="3" fill="#6366F1" filter="url(#glow)" />
  <circle cx="39" cy="33" r="3" fill="#EC4899" filter="url(#glow)" />
  
  <!-- Resolution Checkmark -->
  <path d="M26 40.5 L29.5 43.5 L38 38.5" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>